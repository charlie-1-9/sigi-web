# Configuración de Apache para servir sigi-web (Angular SPA)
# Requiere: mod_rewrite y mod_headers habilitados
#   sudo a2enmod rewrite headers
#
# Uso:
#   1. Copiar el contenido de dist/sigi-web/browser/ a /var/www/sigi-web/
#   2. Colocar este archivo en /etc/apache2/sites-available/sigi-web.conf
#   3. sudo a2ensite sigi-web && sudo systemctl reload apache2

<VirtualHost *:8088>
    ServerName localhost
    DocumentRoot /var/www/sigi-web

    <Directory /var/www/sigi-web>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Rutas de Angular (client-side routing): cualquier ruta que no
        # exista como archivo real cae al index.html para que el Router
        # de Angular la resuelva (equivalente al try_files de Nginx).
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # Cacheo de assets con hash en el nombre
    <FilesMatch "\.(js|css|woff2?|ttf|eot|svg)$">
        Header set Cache-Control "public, max-age=2592000"
    </FilesMatch>

    <Files "assets/status.json">
        Header set Cache-Control "no-store"
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/sigi-web-error.log
    CustomLog ${APACHE_LOG_DIR}/sigi-web-access.log combined
</VirtualHost>
