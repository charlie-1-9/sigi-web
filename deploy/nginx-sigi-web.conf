# Configuración de Nginx para servir sigi-web (Angular SPA)
#
# Uso:
#   1. Copiar el contenido de dist/sigi-web/browser/ a /var/www/sigi-web/
#   2. Colocar este archivo (o solo el bloque server{}) en
#      /etc/nginx/sites-available/sigi-web y enlazarlo en sites-enabled
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Esta misma configuración fue probada end-to-end en un servidor Nginx
# real durante el desarrollo (navegación entre rutas + consumo del
# endpoint /assets/status.json), solo con las rutas absolutas ajustadas
# a este entorno.

server {
    listen 8088;
    # Para producción (dominio público https://sigioti.innovationunamba.tech):
    # cambiar `listen 8088;` por `listen 80;` (y una config aparte con
    # `listen 443 ssl;` si Nginx termina el HTTPS directamente en este
    # servidor, ej. vía certbot) y ajustar server_name abajo.
    server_name sigioti.innovationunamba.tech localhost;

    root /var/www/sigi-web;
    index index.html;

    # Rutas de Angular (client-side routing): cualquier ruta que no sea un
    # archivo real cae al index.html para que el Router de Angular la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo razonable para assets con hash en el nombre
    location ~* \.(?:js|css|woff2?|ttf|eot|svg)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location = /assets/status.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}

