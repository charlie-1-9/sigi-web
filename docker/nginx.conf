# Configuración de Nginx dentro de la imagen Docker.
#
# Es la misma lógica que deploy/nginx-sigi-web.conf (probada end-to-end en
# un servidor Nginx real: navegación entre rutas + consumo del endpoint
# /assets/status.json), solo que escucha en el puerto 80 — el estándar
# dentro de un contenedor — en vez del 8088 usado en la prueba manual.
# El mapeo a un puerto del host se define en docker-compose.yml.

server {
    listen 80;
    # El proxy inverso/ingress del servidor de producción termina el HTTPS
    # y reenvía hacia este puerto 80 del contenedor; server_name solo
    # documenta el dominio público, no cambia el binding del puerto.
    server_name sigioti.innovationunamba.tech localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular (client-side routing): cualquier ruta que no sea un
    # archivo real cae al index.html para que el Router de Angular la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo razonable para assets con hash en el nombre
    location ~* \.(?:js|css|woff2?|ttf|eot|svg)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location = /assets/status.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
